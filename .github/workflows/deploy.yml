name: deploy
on:
  push:
    branches: [nginx*]
    paths: [infrastructure/**, app/**]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment: dev
    env:
      RG: rg-nginx-dev
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy registry, identity and environment
        id: infra
        env:
          DEPLOY_APP: 'false'
        run: |
          DEPLOYMENT_OUTPUTS=$(az deployment group create \
            --resource-group $RG \
            --template-file infrastructure/main.bicep \
            --parameters infrastructure/dev.bicepparam \
            --query properties.outputs -o json)
          ACR=$(jq -r '.acrName.value' <<< "$DEPLOYMENT_OUTPUTS")
          ACR_LOGIN_SERVER=$(jq -r '.acrLoginServer.value' <<< "$DEPLOYMENT_OUTPUTS")
          echo "acr=$ACR" >> "$GITHUB_OUTPUT"
          echo "acr_login_server=$ACR_LOGIN_SERVER" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        env:
          ACR: ${{ steps.infra.outputs.acr }}
          IMAGE: ${{ steps.infra.outputs.acr_login_server }}/nginx-app:${{ github.sha }}
        run: |
          az acr login --name "$ACR"
          docker build -t "$IMAGE" app/
          docker push "$IMAGE"

      - name: Deploy container app
        env:
          DEPLOY_APP: 'true'
          IMAGE: ${{ steps.infra.outputs.acr_login_server }}/nginx-app:${{ github.sha }}
        run: |
          az deployment group create \
            --resource-group $RG \
            --template-file infrastructure/main.bicep \
            --parameters infrastructure/dev.bicepparam